plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.tejpphone'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.tejpphone"
        minSdk 27
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // phone: phones and tablets. quest: Meta Quest, with a mixed reality mode built on the
    // Meta Spatial SDK (see src/quest).
    flavorDimensions = ["device"]
    productFlavors {
        phone {
            dimension "device"
            isDefault true
        }
        quest {
            dimension "device"
            minSdk 34   // Horizon OS is Android 14
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    questImplementation libs.meta.spatial.sdk
    questImplementation libs.meta.spatial.sdk.toolkit
    questImplementation libs.meta.spatial.sdk.vr
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}